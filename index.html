<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>果冻网格 · Jelly Grid</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23ffc42e'/%3E%3C/svg%3E">
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:#2a1a00;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
    cursor:crosshair;
    -webkit-user-select:none;-moz-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 1.1s ease;}
  #scene.ready{opacity:1;}
  .brand{
    position:fixed;left:26px;top:24px;
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(255,238,190,.5);
    pointer-events:none;user-select:none;
  }
  .brand b{display:block;font-size:15px;letter-spacing:.22em;color:rgba(255,246,214,.72);margin-bottom:5px;font-weight:500;}
  .hint{
    position:fixed;left:0;right:0;bottom:30px;
    text-align:center;font-size:13px;letter-spacing:.12em;
    color:rgba(255,242,205,.55);
    pointer-events:none;user-select:none;
    opacity:0;
    transition:opacity .8s ease;
  }
  .hint.on{opacity:1;}
  .hint.gone{opacity:0;}
  .hint i{display:inline-block;width:4px;height:4px;border-radius:50%;background:rgba(255,242,205,.45);margin:0 12px;vertical-align:2px;}
  .nogl{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#ffe9a8;font-size:14px;letter-spacing:.1em;}

  .ui{
    position:fixed;right:24px;top:22px;z-index:10;
    display:flex;gap:10px;
    transition:opacity .55s ease, transform .55s ease;
  }
  .ui.dim{opacity:0;transform:translateY(-6px);pointer-events:none;}
  .btn{
    position:relative;isolation:isolate;overflow:hidden;
    display:inline-flex;align-items:center;gap:7px;
    padding:10px 18px;border:0;border-radius:999px;
    font:inherit;font-size:13px;letter-spacing:.06em;
    color:#fff;text-shadow:0 1px 3px rgba(70,34,0,.45), 0 0 10px rgba(70,34,0,.30);
    background:rgba(255,255,255,.018);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.16),
               inset 0 -1px 0 rgba(255,255,255,.05);
    touch-action:manipulation;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .25s ease, transform .25s ease, box-shadow .25s ease;
  }
  .btn:hover{background:rgba(255,255,255,.05);transform:translateY(-1px);}
  .btn:active{transform:translateY(0) scale(.98);}

  .btn .flow{
    position:absolute;left:-45%;top:-70%;width:190%;height:240%;
    pointer-events:none;mix-blend-mode:screen;opacity:.30;
    background:
      radial-gradient(38% 52% at 28% 42%, rgba(255,255,255,.30), transparent 62%),
      radial-gradient(44% 58% at 74% 60%, rgba(255,255,255,.17), transparent 66%),
      radial-gradient(30% 40% at 56% 18%, rgba(255,255,255,.13), transparent 70%);
    animation:flowA 15s ease-in-out infinite alternate;
    will-change:transform;
  }
  .btn .flow.b{
    opacity:.20;
    background:
      radial-gradient(34% 48% at 62% 34%, rgba(255,255,255,.22), transparent 64%),
      radial-gradient(40% 52% at 26% 66%, rgba(255,255,255,.14), transparent 68%);
    animation:flowB 19s ease-in-out infinite alternate;
  }
  @keyframes flowA{
    0%  {transform:translate3d(-6%,-7%,0) rotate(-5deg) scale(1.05);}
    50% {transform:translate3d(5%,6%,0)   rotate(3deg)  scale(1.13);}
    100%{transform:translate3d(-3%,8%,0)  rotate(-2deg) scale(1.06);}
  }
  @keyframes flowB{
    0%  {transform:translate3d(7%,5%,0)   rotate(4deg)  scale(1.10);}
    50% {transform:translate3d(-5%,-6%,0) rotate(-3deg) scale(1.04);}
    100%{transform:translate3d(4%,-4%,0)  rotate(2deg)  scale(1.12);}
  }

  .btn::after{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
    pointer-events:none;
    background:linear-gradient(135deg,
      rgba(255,255,255,.62), rgba(255,255,255,.07) 34%,
      rgba(255,255,255,.02) 58%, rgba(255,255,255,.40));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  .btn .lb{position:relative;z-index:2;white-space:nowrap;}
  .btn .dot{
    position:relative;z-index:2;width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.78);box-shadow:0 0 7px rgba(255,255,255,.55);
  }
  @media (max-width:520px){
    .ui{right:14px;top:14px;gap:8px;}
    .btn{padding:9px 14px;font-size:12px;}
  }
  .toast{
    position:fixed;left:0;right:0;top:50%;
    transform:translateY(-50%) translateY(0);
    text-align:center;font-size:13px;letter-spacing:.16em;
    color:rgba(255,249,226,.80);
    text-shadow:0 1px 3px rgba(70,34,0,.45), 0 0 10px rgba(70,34,0,.30);
    pointer-events:none;user-select:none;
    opacity:0;
    transition:opacity .55s ease, transform .55s ease;
  }
  .toast.show{opacity:1;transform:translateY(-50%) translateY(-4px);}
  .disc{
    position:fixed;left:22px;z-index:11;
    bottom:calc(22px + env(safe-area-inset-bottom, 0px));
    width:58px;height:58px;
    border:0;padding:0;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;isolation:isolate;
    background:linear-gradient(148deg,
      rgba(74,34,2,.62), rgba(38,16,0,.52) 46%, rgba(88,42,4,.58));
    backdrop-filter:blur(16px) saturate(150%) brightness(.72);
    -webkit-backdrop-filter:blur(16px) saturate(150%) brightness(.72);
    box-shadow:
      inset 0 1px 1px rgba(255,240,205,.50),
      inset 0 -2px 5px rgba(0,0,0,.30),
      inset 0 0 16px rgba(255,226,160,.10),
      0 6px 18px rgba(42,18,0,.48),
      0 0 0 1px rgba(255,238,200,.22);
    touch-action:manipulation;cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    opacity:0;pointer-events:none;
    transform:translateY(8px) scale(.88);
    transition:opacity .9s ease, transform .9s cubic-bezier(.22,1,.36,1);
  }
  .disc.on{opacity:1;pointer-events:auto;transform:translateY(0) scale(1);animation:discPulse 2.4s ease-in-out 2;}
  @keyframes discPulse{
    0%,100%{box-shadow:
      inset 0 1px 1px rgba(255,240,205,.50),
      inset 0 -2px 5px rgba(0,0,0,.30),
      inset 0 0 16px rgba(255,226,160,.10),
      0 6px 18px rgba(42,18,0,.48),
      0 0 0 1px rgba(255,238,200,.22);}
    50%{box-shadow:
      inset 0 1px 1px rgba(255,240,205,.62),
      inset 0 -2px 5px rgba(0,0,0,.30),
      inset 0 0 20px rgba(255,232,175,.20),
      0 6px 22px rgba(42,18,0,.55),
      0 0 0 3px rgba(255,238,200,.30);}
  }
  .disc:active{transform:translateY(0) scale(.95);}
  .disc::before{
    content:'';position:absolute;left:-32%;top:-32%;width:164%;height:164%;
    pointer-events:none;mix-blend-mode:screen;opacity:.42;
    background:
      radial-gradient(36% 36% at 30% 28%, rgba(255,255,255,.42), transparent 62%),
      radial-gradient(46% 46% at 72% 72%, rgba(255,255,255,.18), transparent 66%);
    animation:discFlow 13s ease-in-out infinite alternate;
    will-change:transform;
  }
  .disc::after{
    content:'';position:absolute;inset:0;border-radius:inherit;padding:1px;
    pointer-events:none;
    background:linear-gradient(150deg,
      rgba(255,244,214,.82), rgba(255,236,190,.18) 40%,
      rgba(255,240,200,.10) 62%, rgba(255,246,220,.52));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask-composite:exclude;
  }
  @keyframes discFlow{
    0%  {transform:translate3d(-5%,-6%,0) rotate(-9deg) scale(1.03);}
    100%{transform:translate3d(6%,5%,0)  rotate(10deg) scale(1.12);}
  }
  .book{position:relative;z-index:2;width:26px;height:18px;}
  .book i{position:absolute;display:block;}
  .book .pg{
    top:0;width:12px;height:18px;
    background:
      linear-gradient(180deg, rgba(255,253,244,.98), rgba(255,247,228,.86)),
      repeating-linear-gradient(180deg, transparent 0 3px, rgba(120,70,10,.28) 3px 4px);
    box-shadow:0 1px 3px rgba(0,0,0,.42);
  }
  .book .pg.l{
    left:0;border-radius:2px 4px 4px 2px;
    transform-origin:right center;
    transform:perspective(34px) rotateY(14deg);
  }
  .book .pg.r{
    right:0;border-radius:4px 2px 2px 4px;
    transform-origin:left center;
    transform:perspective(34px) rotateY(-14deg);
  }
  .book .sp{
    left:50%;top:0;width:2px;height:18px;margin-left:-1px;
    background:linear-gradient(180deg, rgba(255,255,255,1), rgba(255,250,230,.92));
    box-shadow:0 0 6px rgba(255,242,205,.75);
  }
  @media (max-width:520px){
    .disc{
      left:16px;width:52px;height:52px;
      bottom:calc(18px + env(safe-area-inset-bottom, 0px));
    }
    .book{width:24px;height:16px;}
    .book .pg{width:11px;height:16px;}
    .book .sp{height:16px;}
  }
  body.clean .brand,body.clean .hint{opacity:0;transition:opacity .6s ease;}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="ui" id="ui">
  <button class="btn" id="btnFull" type="button">
    <i class="flow"></i><i class="flow b"></i>
    <i class="dot"></i><span class="lb" id="lbFull">全屏播放</span>
  </button>
  <button class="btn" id="btnSoothe" type="button">
    <i class="flow"></i><i class="flow b"></i>
    <i class="dot"></i><span class="lb">一键抚平</span>
  </button>
</div>
<div class="brand"><b>果冻网格</b>Jelly&nbsp;Grid</div>
<div class="hint" id="hint">移动鼠标贴近果冻<i></i>按住越久，陷得越深</div>
<div class="toast" id="toast">双击屏幕召回按钮</div>
<button class="disc" id="disc" type="button" aria-label="免责声明"><i class="book"><i class="pg l"></i><i class="pg r"></i><i class="sp"></i></i></button>

<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
#extension GL_OES_standard_derivatives : enable
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec2  uRes;
uniform float uTime;
uniform vec2  uMouse;
uniform float uPress;
uniform float uDent;
uniform float uChroma;
uniform float uSway;
uniform float uIntro;
uniform float uGrid;
uniform vec4  uRip[4];
uniform vec4  uTrail[8];
uniform float uAura;

const float DEPTH = 0.44;
const float SLOPE = 0.26;

vec3 spectrum(float t){
    return 0.5 + 0.5 * cos(6.28318530718 * (t + vec3(0.00, 0.33, 0.67)));
}

float hash21(vec2 p){
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
}

float vnoise(vec2 p){
    vec2 i = floor(p);
    vec2 f = fract(p);
    vec2 u = f*f*(3.0 - 2.0*f);
    float a = hash21(i);
    float b = hash21(i + vec2(1.0, 0.0));
    float c = hash21(i + vec2(0.0, 1.0));
    float d = hash21(i + vec2(1.0, 1.0));
    return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

float fbm(vec2 p){
    float s = 0.0, a = 0.5;
    for(int i = 0; i < 3; i++){
        s += a * vnoise(p);
        p = p * 2.03 + vec2(1.7, 9.2);
        a *= 0.5;
    }
    return s;
}

float surface(vec2 p){
    float t = uTime;
    float amp = uSway * uIntro;

    vec2 warp = vec2(sin(p.y*1.55 + t*0.33), cos(p.x*1.35 - t*0.27)) * 0.34;
    float n = fbm((p + warp) * 1.45 + vec2(t*0.045, -t*0.032)) - 0.5;
    float h = n * 0.185 * amp;

    h += 0.042 * sin(p.x*1.75 + t*0.62) * cos(p.y*1.45 - t*0.48) * amp;
    h += 0.022 * sin((p.x + p.y)*2.10 - t*0.41) * amp;

    vec2  d  = p - uMouse;
    float dd = dot(d, d);
    float ad = abs(uDent);
    float rad = mix(0.46, 0.34, clamp(ad, 0.0, 1.0));
    float dk  = mix(0.340, 0.175, step(0.0, uDent));
    h -= uPress * 0.085 * exp(-dd/(0.46*0.46));
    h -= uDent * dk * exp(-dd/(rad*rad));
    float k = (sqrt(dd) - rad*1.05) / 0.20;
    h += (uPress * 0.026 + ad * 0.050) * exp(-k*k);

    for(int i = 0; i < 4; i++){
        vec4 R = uRip[i];
        if(R.w > 0.002){
            float rd = length(p - R.xy);
            float x  = rd - R.z * 1.05;
            float pulse = sin(x * 6.5) * exp(-x*x * 7.0);
            h += pulse * exp(-rd*1.5) * exp(-R.z*1.25) * R.w * 0.085;
        }
    }
    for(int j = 0; j < 8; j++){
        vec4 T = uTrail[j];
        float e = T.w * exp(-T.z * 0.55);
        if(e > 0.004){
            vec2 dv = p - T.xy;
            h -= e * 0.045 * exp(-dot(dv, dv) * 18.0);
        }
    }
    return h;
}

vec2 surfGrad(vec2 p){
    float e = 0.020;
    float hx = surface(p + vec2(e,0.0)) - surface(p - vec2(e,0.0));
    float hy = surface(p + vec2(0.0,e)) - surface(p - vec2(0.0,e));
    return vec2(hx, hy) / (2.0*e);
}

vec3 gridLayers(vec2 p, vec2 disp, float S, float hw){
    vec2 gv = (p + disp) * S + vec2(uTime*0.055, -uTime*0.038);
    vec2 c  = abs(fract(gv) - 0.5);
    float d = min(c.x, c.y);
    float base = S / uRes.y;
    float comp = 1.0;
#ifdef GL_OES_standard_derivatives
    float fw = max(fwidth(gv.x), fwidth(gv.y));
    float aa = base * 0.85 + fw * 0.30;
    comp = fw / max(base, 1e-6);
#else
    float aa = base * 1.2;
#endif
    float line = 1.0 - smoothstep(hw, hw + aa*1.35, d);
    float glow = (1.0 - smoothstep(0.0, 5.0*aa + hw*3.0, d));
#ifdef GL_OES_standard_derivatives
    float fade = 1.0 / (1.0 + max(0.0, comp - 1.35) * 2.2);
    line *= fade;
    glow *= fade;
#endif
    return vec3(line, glow*0.55, comp);
}

void main(){
    vec2 frag = gl_FragCoord.xy;
    vec2 p = (frag - 0.5*uRes) / uRes.y;

    float h = surface(p);
    vec2  g = surfGrad(p);

    vec2 disp = p * h * DEPTH + g * h * SLOPE;
    float dl = length(disp);
    disp *= 1.0 / (1.0 + dl * 2.2);

    vec2 gv0 = (p + disp) * uGrid + vec2(uTime*0.055, -uTime*0.038);
    float blob = vnoise(gv0 * 0.26 + vec2(uTime*0.020, -uTime*0.014));
    float fine = vnoise(gv0 * 0.95 - vec2(uTime*0.030, uTime*0.022));
    float hue = blob * 1.10 + fine * 0.40
              + dot(p, vec2(0.55, -0.38)) * 0.80
              + h * 3.4
              + uTime * 0.022;

    vec3 n = normalize(vec3(-g.x, -g.y, 1.7));
    vec3 L = normalize(vec3(-0.48, 0.62, 0.82));
    float diff = dot(n, L)*0.5 + 0.5;
    float specA = pow(max(dot(reflect(-L, n), vec3(0.0,0.0,1.0)), 0.0), 22.0);
    float specB = pow(max(dot(reflect(-L, n), vec3(0.0,0.0,1.0)), 0.0), 90.0);
    float fres  = pow(1.0 - clamp(n.z, 0.0, 1.0), 2.6);

    vec3 cLow  = vec3(0.58, 0.27, 0.01);
    vec3 cMid  = vec3(1.00, 0.67, 0.05);
    vec3 cHigh = vec3(1.00, 0.93, 0.56);
    vec3 col = mix(cLow, cMid, smoothstep(-0.13, 0.04, h));
    col = mix(col, cHigh, smoothstep(0.03, 0.16, h));
    col *= 0.80 + 0.35*diff;
    col += (specA*0.26 + specB*0.30) * vec3(1.00, 0.98, 0.88);

    float near = exp(-dot(p - uMouse, p - uMouse) / (0.52*0.52));
    col += fres * 0.075 * diff * spectrum(hue * 0.75 + 0.32) * uChroma * near;

    float caust = pow(max(0.0, sin((p.x*0.8 + p.y*1.2)*7.5 + h*30.0 + uTime*0.5)), 9.0);
    col += caust * 0.045 * vec3(1.00, 0.95, 0.72);

    for(int j = 0; j < 8; j++){
        vec4 T = uTrail[j];
        float e = T.w * exp(-T.z * 0.55);
        if(e > 0.004){
            float td = length(p - T.xy);
            float rr = td - T.z * 0.60;
            float wave = sin(rr * 8.5) * exp(-rr*rr * 22.0);
            col += spectrum(hue * 0.90 + 0.40 + T.z * 0.12) * wave * e * 0.20 * (0.30 + 0.70*diff);
        }
    }

    float ar = length(p - uMouse);
    float qa = (ar - 0.150) / (0.062 + 0.030*uAura);
    float ra = exp(-qa*qa);
    float qb = (ar - 0.262) / 0.108;
    float rb = exp(-qb*qb);
    vec3  auraCol = spectrum(hue * 0.90 + 0.44);
    col += auraCol * (ra * 0.30 + rb * 0.12) * uAura * (0.35 + 0.65*diff) * uIntro;
    col += vec3(1.00, 0.97, 0.86) * ra * uAura * 0.09 * uIntro;

    col *= 1.0 - clamp(0.14*uPress + 0.30*uChroma, 0.0, 0.42) * near;
    col += max(0.0, -uDent) * 0.17 * near * vec3(1.00, 0.96, 0.82);

    float S  = uGrid;
    float hw = 0.42 * S / uRes.y;

    vec3 gr = gridLayers(p, disp*1.012, S, hw);
    vec3 gg = gridLayers(p, disp,       S, hw);
    vec3 gb = gridLayers(p, disp*0.988, S, hw);
    vec3 amt  = vec3(gr.x, gg.x, gb.x);
    float gl  = max(gr.y, max(gg.y, gb.y));
    float twist = smoothstep(1.08, 1.85, max(gg.z, max(gr.z, gb.z)));

    float zone = exp(-dot(p - uMouse, p - uMouse) / (0.30*0.30));
    float cAmt = uChroma * zone * uIntro * (0.62 + 0.38*twist);

    vec3 base   = spectrum(hue * 0.8 + 0.15);
    vec3 lumB   = vec3(dot(base, vec3(0.299, 0.587, 0.114)));
    vec3 soft   = mix(lumB, base, 0.78);
    soft = mix(vec3(1.00, 0.97, 0.88), soft, 0.84);
    soft /= max(max(soft.r, max(soft.g, soft.b)), 1e-4);

    float cov = clamp(max(amt.r, max(amt.g, amt.b)), 0.0, 1.0) * uIntro;
    float lit = 0.34 + 0.30*diff + 0.26*smoothstep(0.02, 0.14, -h);

    vec3 lineCol = vec3(1.00, 0.96, 0.84);

    lineCol = mix(lineCol, soft, clamp(cAmt * 0.95, 0.0, 1.0));

    col  = mix(col, lineCol * (0.30 + 0.80*lit), cov * 0.88);
    col += lineCol * gl * 0.075 * (0.35 + 0.65*diff) * uIntro;
    col  = mix(col, soft * (0.34 + 0.74*lit), clamp(cAmt * cov * 0.95, 0.0, 1.0));
    col += soft * cAmt * 0.10 * (0.4 + 0.6*diff) * uIntro;

    float vig = smoothstep(1.32, 0.28, length(p*vec2(0.85, 1.0)));
    col *= 0.70 + 0.30*vig;
    float grain = fract(sin(dot(frag, vec2(12.9898, 78.233))) * 43758.5453);
    col += (grain - 0.5) * 0.008;
    col = pow(clamp(col, 0.0, 1.0), vec3(0.94));

    gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
(function(){
  var canvas = document.getElementById('scene');
  var hintEl = document.getElementById('hint');
  if(hintEl){
    requestAnimationFrame(function(){ hintEl.classList.add('on'); });
    setTimeout(function(){ hintEl.classList.add('gone'); }, 5000);
  }
  var gl = canvas.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'})
        || canvas.getContext('experimental-webgl');
  if(!gl){
    canvas.style.display = 'none';
    var d = document.createElement('div');
    d.className = 'nogl';
    d.textContent = '当前浏览器不支持 WebGL，无法渲染果冻动画';
    document.body.appendChild(d);
    return;
  }
  var hasDeriv = !!gl.getExtension('OES_standard_derivatives');

  function compile(type, src){
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById('vs').textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(prog);
  if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  var U = {};
  ['uRes','uTime','uMouse','uPress','uDent','uChroma','uSway','uIntro','uGrid','uAura'].forEach(function(n){
    U[n] = gl.getUniformLocation(prog, n);
  });
  U.uRip = gl.getUniformLocation(prog, 'uRip[0]') || gl.getUniformLocation(prog, 'uRip');
  U.uTrail = gl.getUniformLocation(prog, 'uTrail[0]') || gl.getUniformLocation(prog, 'uTrail');

  var CELL_MM = 5.0;
  var gridS = 48.0;

  function resize(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var w = Math.max(1, Math.floor(window.innerWidth  * dpr));
    var h = Math.max(1, Math.floor(window.innerHeight * dpr));
    if(canvas.width !== w || canvas.height !== h){ canvas.width = w; canvas.height = h; }
    gl.viewport(0, 0, w, h);
    var cellCss = CELL_MM / 25.4 * 96.0;
    gridS = Math.max(8, window.innerHeight / cellCss);
  }
  window.addEventListener('resize', resize);
  resize();

  var tMouse = {x:0, y:0}, sMouse = {x:0, y:0};
  var press = 0, pressV = 0;
  var dent = 0, dentV = 0, springing = false;
  var dentW = 2.0, dentZ = 0.45;
  var sway = 0.45, hover = false, pressed = false;
  var gate = 1, gateDur = 1;
  var soothe = 0;
  var chroma = 0;
  var lastMove = -1e9, ripIdx = 0;
  var rip = [];
  for(var i = 0; i < 4; i++) rip.push({x:0, y:0, t0:-99});
  var TRAIL_N = 8;
  var trail = [];
  for(var i = 0; i < TRAIL_N; i++) trail.push({x:0, y:0, t0:-99, s:0});
  var trailBuf = new Float32Array(TRAIL_N*4);
  var trailIdx = 0, lastTrail = -1e9, spd = 0, aura = 0, accD = 0;
  var ripBuf = new Float32Array(16);

  function toJelly(cx, cy){
    var W = window.innerWidth, H = window.innerHeight;
    return { x:(cx - W*0.5)/H, y:(H*0.5 - cy)/H };
  }
  function pointerAt(x, y){
    var j = toJelly(x, y);
    var nt = performance.now();
    if(hover){
      var dx = j.x - tMouse.x, dy = j.y - tMouse.y;
      var dist = Math.sqrt(dx*dx + dy*dy);
      var gap = Math.max(10, nt - lastMove);
      spd += (dist / (gap*0.001) - spd) * 0.40;
      accD += dist;
      if(accD > 0.028 && nt - lastTrail > 120){
        var q = trail[trailIdx % TRAIL_N]; trailIdx++;
        q.x = j.x; q.y = j.y; q.t0 = nt*0.001;
        q.s = Math.min(1, 0.45 + spd*0.30);
        lastTrail = nt; accD = 0;
      }
    }else{
      accD = 0;
    }
    tMouse.x = j.x; tMouse.y = j.y;
    hover = true;
    lastMove = nt;
  }
  function releaseHover(){ hover = false; }

  window.addEventListener('pointermove', function(e){ pointerAt(e.clientX, e.clientY); }, {passive:true});
  function letGo(){
    if(!pressed) return;
    pressed = false;
    var pk = Math.max(0, Math.min(1, dent));
    dentW = 2.45 - 0.85 * pk;
    dentZ = 0.52 - 0.12 * pk;
    springing = true;
    gate = 0;
    gateDur = 3.5 + 3.0 * pk;
  }

  window.addEventListener('pointerdown', function(e){
    pointerAt(e.clientX, e.clientY);
    pressed = true;
    springing = false;
    dentV = 0;
    if(dent < 0.15) dent = 0.15;
    var j = toJelly(e.clientX, e.clientY);
    var r = rip[ripIdx % 4]; ripIdx++;
    r.x = j.x; r.y = j.y; r.t0 = performance.now()/1000;
  }, {passive:true});
  window.addEventListener('pointerup', letGo, {passive:true});
  window.addEventListener('pointercancel', letGo, {passive:true});
  window.addEventListener('pointerleave', function(){ releaseHover(); letGo(); });
  document.addEventListener('mouseleave', function(){ hover = false; letGo(); });
  window.addEventListener('blur', function(){ hover = false; letGo(); });
  document.addEventListener('visibilitychange', function(){
    if(document.hidden){ hover = false; letGo(); }
  });

  var coarse = (window.matchMedia && window.matchMedia('(hover: none)').matches)
            || (navigator.maxTouchPoints > 0 && !window.matchMedia('(hover: hover)').matches);
  window.addEventListener('contextmenu', function(e){
    if(coarse || (e.pointerType === 'touch')){ e.preventDefault(); }
    else { letGo(); }
  });
  if(coarse){
    function notUI(e){
      var t = e.target;
      return !(t && t.closest && (t.closest('.ui') || t.closest('.disc')));
    }
    document.addEventListener('touchstart', function(e){ if(notUI(e)) e.preventDefault(); }, {passive:false});
    document.addEventListener('touchmove',  function(e){ if(notUI(e)) e.preventDefault(); }, {passive:false});
    var lastTap = -1e9;
    document.addEventListener('touchend', function(e){
      if(!notUI(e)) return;
      var n = performance.now();
      if(n - lastTap < 340 && clean) showUI();
      lastTap = n;
    }, {passive:true});
  }

  var uiEl = document.getElementById('ui');
  var btnFull = document.getElementById('btnFull');
  var btnSoothe = document.getElementById('btnSoothe');
  var lbFull = document.getElementById('lbFull');
  var toastEl = document.getElementById('toast');
  var discEl = document.getElementById('disc');
  var DISC_URL = 'https://raw.githubusercontent.com/1minecraftgangyi/JellyDisclaimer/refs/heads/main/%E5%85%8D%E8%B4%A3%E5%A3%B0%E6%98%8E.txt';
  var clean = false, uiTimer = 0, toastTimer = 0, discTimer = 0, discHide = 0;

  function showDisc(delay){
    if(!discEl) return;
    clearTimeout(discTimer); clearTimeout(discHide);
    discTimer = setTimeout(function(){
      discEl.classList.add('on');
      discHide = setTimeout(function(){ discEl.classList.remove('on'); }, 8000);
    }, delay);
  }
  showDisc(10000);
  if(discEl){
    discEl.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
    discEl.addEventListener('pointerup', function(e){ e.stopPropagation(); });
    discEl.addEventListener('pointermove', function(e){ e.stopPropagation(); });
    discEl.addEventListener('click', function(e){
      e.stopPropagation();
      if(!DISC_URL) return;
      var w = window.open(DISC_URL, '_blank', 'noopener,noreferrer');
      if(!w) window.location.href = DISC_URL;
    });
  }

  function toast(){
    if(!toastEl) return;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toastEl.classList.remove('show'); }, 1000);
  }

  function showUI(){
    uiEl.classList.remove('dim');
    clearTimeout(uiTimer);
    if(clean) uiTimer = setTimeout(function(){ uiEl.classList.add('dim'); }, 2400);
  }
  function enterClean(){
    clean = true;
    document.body.classList.add('clean');
    lbFull.textContent = '退出全屏';
    clearTimeout(uiTimer);
    uiEl.classList.add('dim');
    toast();
  }
  function exitClean(){
    clean = false;
    document.body.classList.remove('clean');
    lbFull.textContent = '全屏播放';
    clearTimeout(uiTimer);
    uiEl.classList.remove('dim');
    showDisc(5000);
  }
  function inFS(){ return !!(document.fullscreenElement || document.webkitFullscreenElement); }
  function callFS(fn, ctx){
    if(!fn) return;
    try{ var p = fn.call(ctx); if(p && p.catch) p.catch(function(){}); }catch(e){}
  }
  btnFull.addEventListener('click', function(){
    if(clean){
      if(inFS()) callFS(document.exitFullscreen || document.webkitExitFullscreen, document);
      else exitClean();
    }else{
      enterClean();
      var el = document.documentElement;
      callFS(el.requestFullscreen || el.webkitRequestFullscreen, el);
    }
  });
  btnSoothe.addEventListener('click', function(){
    soothe = 0.75;
    hover = false; pressed = false;
    dent = 0; dentV = 0; springing = false; gate = 1; chroma = 0;
    for(var i = 0; i < 4; i++) rip[i].t0 = -99;
    for(var i = 0; i < TRAIL_N; i++) trail[i].t0 = -99;
    trailIdx = 0; spd = 0; aura = 0; accD = 0;
    lastMove = performance.now();
  });

  [btnFull, btnSoothe].forEach(function(b){
    b.addEventListener('pointerdown', function(e){ e.stopPropagation(); });
  });
  btnFull.addEventListener('pointermove', function(e){ e.stopPropagation(); });
  btnSoothe.addEventListener('pointermove', function(e){ e.stopPropagation(); });
  document.addEventListener('fullscreenchange', function(){ if(!inFS() && clean) exitClean(); else resize(); });
  document.addEventListener('webkitfullscreenchange', function(){ if(!inFS() && clean) exitClean(); else resize(); });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && clean && !inFS()) exitClean();
  });

  window.addEventListener('dblclick', function(){ if(clean) showUI(); });

  var start = performance.now(), last = start;

  function frame(now){
    var dt = Math.min(0.033, (now - last)/1000); last = now;
    var t  = now/1000;

    var idle = Math.min(1, Math.max(0, (now - lastMove - 700)/1800));
    var swayTarget = pressed ? 0.40 : (0.45 + 0.80*idle);
    sway += (swayTarget - sway) * (1 - Math.exp(-dt*2.0));

    var auraT = Math.min(1, spd * 0.50);
    aura += (auraT - aura) * (1 - Math.exp(-dt*(auraT > aura ? 10.0 : 3.4)));
    spd *= Math.exp(-dt*4.2);

    var kp = 1 - Math.exp(-dt*9.0);
    sMouse.x += (tMouse.x - sMouse.x) * kp;
    sMouse.y += (tMouse.y - sMouse.y) * kp;

    if(soothe > 0){

      soothe -= dt;
      var e = Math.exp(-dt * 6.5);
      press *= e; pressV *= e; dent *= e; dentV *= e;
      springing = false; gate = 1;
      hover = false; pressed = false;
    }else{

      if(pressed){
        dent += (1.0 - dent) * (1 - Math.exp(-dt*1.5));
        dentV *= Math.exp(-dt*5.0);
      }else if(springing){
        dentV += (-dentW*dentW*dent - 2.0*dentZ*dentW*dentV) * dt;
        dent  += dentV * dt;
        if(Math.abs(dent) < 0.004 && Math.abs(dentV) < 0.008){
          dent = 0; dentV = 0; springing = false;
        }
      }

      if(gate < 1) gate = Math.min(1, gate + dt / Math.max(0.5, gateDur));

      var tgt = hover ? gate : 0.0;
      pressV += ((tgt - press)*170.0 - pressV*30.0) * dt;
      press  += pressV * dt;

      var cT = pressed ? Math.max(0, Math.min(1, dent*1.7)) : 0.0;
      chroma += (cT - chroma) * (1 - Math.exp(-dt*(pressed ? 8.0 : 6.0)));
      if(chroma < 0.002) chroma = 0;
    }

    var intro = Math.min(1, (now - start)/1400);
    intro = 1 - Math.pow(1 - intro, 3);

    for(var i = 0; i < 4; i++){
      var r = rip[i], age = t - r.t0;
      ripBuf[i*4+0] = r.x; ripBuf[i*4+1] = r.y; ripBuf[i*4+2] = age;
      ripBuf[i*4+3] = (age > 6.0) ? 0.0 : 1.0;
    }

    gl.uniform2f(U.uRes, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, t);
    gl.uniform2f(U.uMouse, sMouse.x, sMouse.y);
    gl.uniform1f(U.uPress, press);
    gl.uniform1f(U.uDent, dent);
    gl.uniform1f(U.uChroma, chroma);
    gl.uniform1f(U.uSway, sway);
    gl.uniform1f(U.uIntro, intro);
    gl.uniform1f(U.uGrid, gridS);
    gl.uniform4fv(U.uRip, ripBuf);
    for(var i = 0; i < TRAIL_N; i++){
      var q = trail[i], qa = t - q.t0;
      trailBuf[i*4+0] = q.x; trailBuf[i*4+1] = q.y; trailBuf[i*4+2] = qa;
      trailBuf[i*4+3] = (qa > 2.6) ? 0.0 : q.s * Math.max(0, 1 - qa/2.6);
    }
    gl.uniform4fv(U.uTrail, trailBuf);
    gl.uniform1f(U.uAura, aura);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  requestAnimationFrame(function(){ canvas.classList.add('ready'); });
})();
</script>
</body>
</html>
